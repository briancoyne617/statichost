<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- pencil, leaning on the left, tip up -->
  <g transform="rotate(-30 16 30)">
    <path d="M11 4 L19 4 L15 -4 Z" fill="#3D3320"/>
    <rect x="11" y="4" width="8" height="34" fill="#FFC857"/>
    <rect x="11" y="38" width="8" height="4" fill="#F7F5F0"/>
    <rect x="11" y="42" width="8" height="7" rx="2" fill="#FF8FA3"/>
  </g>
  <!-- two upright book spines, bottom-aligned on the base book -->
  <rect x="24" y="20" width="10" height="30" rx="2" fill="#7A3B54"/>
  <rect x="36" y="10" width="14" height="40" rx="2" fill="#FF6F91"/>
  <!-- base book, flat, underneath everything -->
  <rect x="4" y="48" width="58" height="14" rx="3" fill="#E8607A"/>
  <rect x="55" y="48" width="7" height="14" rx="2" fill="#FBE6D8"/>
</svg>
